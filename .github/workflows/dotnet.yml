name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ADDS-PIM.slnx

      - name: Build
        run: dotnet build ADDS-PIM.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ADDS-PIM.slnx --configuration Release --no-build --verbosity normal
